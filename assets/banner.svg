<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Quantum Bio-Forge banner" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b18"/>
      <stop offset="0.55" stop-color="#14103a"/>
      <stop offset="1" stop-color="#0b2a33"/>
    </linearGradient>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.5" stop-color="#c4b5fd"/>
      <stop offset="1" stop-color="#2dd4bf"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#2dd4bf" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="atomA" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#e9d5ff"/>
      <stop offset="0.5" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#3b1d8f"/>
    </radialGradient>
    <radialGradient id="atomB" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#ccfbf1"/>
      <stop offset="0.5" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#0f5e57"/>
    </radialGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="8" flood-color="#000" flood-opacity="0.55"/>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#8b5cf6" stroke-opacity="0.12"/>
    </pattern>
    <text id="title" x="60" y="152" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="62" font-weight="900" letter-spacing="2">QUANTUM BIO-FORGE</text>
    <clipPath id="clip"><rect width="1200" height="320" rx="22"/></clipPath>
  </defs>

  <g clip-path="url(#clip)">
    <rect width="1200" height="320" fill="url(#bg)"/>
    <rect width="1200" height="320" fill="url(#grid)"/>

    <!-- scanning beam -->
    <rect y="0" width="260" height="320" fill="url(#scan)" opacity="0.5">
      <animate attributeName="x" values="-260;1200" dur="7s" repeatCount="indefinite"/>
    </rect>

    <!-- molecule cluster (right) -->
    <g filter="url(#soft)">
      <g stroke="#a78bfa" stroke-opacity="0.55" stroke-width="3" fill="none">
        <path d="M900 90 L990 150 L1080 105"/>
        <path d="M990 150 L975 245"/>
        <path d="M1080 105 L1115 200 L975 245"/>
        <path d="M900 90 L860 180 L975 245"/>
      </g>
      <g>
        <circle cx="900" cy="90" r="22" fill="url(#atomA)">
          <animate attributeName="cy" values="90;80;90" dur="4s" repeatCount="indefinite"/>
        </circle>
        <circle cx="990" cy="150" r="30" fill="url(#atomB)" filter="url(#glow)">
          <animate attributeName="r" values="30;34;30" dur="3s" repeatCount="indefinite"/>
        </circle>
        <circle cx="1080" cy="105" r="18" fill="url(#atomA)">
          <animate attributeName="cy" values="105;118;105" dur="5s" repeatCount="indefinite"/>
        </circle>
        <circle cx="975" cy="245" r="26" fill="url(#atomA)">
          <animate attributeName="cy" values="245;236;245" dur="4.5s" repeatCount="indefinite"/>
        </circle>
        <circle cx="1115" cy="200" r="16" fill="url(#atomB)">
          <animate attributeName="r" values="16;19;16" dur="2.6s" repeatCount="indefinite"/>
        </circle>
        <circle cx="860" cy="180" r="14" fill="url(#atomB)">
          <animate attributeName="cx" values="860;852;860" dur="3.6s" repeatCount="indefinite"/>
        </circle>
      </g>
      <!-- orbit ring around the central atom -->
      <ellipse cx="990" cy="150" rx="62" ry="22" fill="none" stroke="#2dd4bf" stroke-opacity="0.6" stroke-width="2">
        <animateTransform attributeName="transform" type="rotate" from="0 990 150" to="360 990 150" dur="8s" repeatCount="indefinite"/>
      </ellipse>
      <circle r="5" fill="#fff" filter="url(#glow)">
        <animateMotion dur="8s" repeatCount="indefinite" path="M928,150 a62,22 0 1,0 124,0 a62,22 0 1,0 -124,0"/>
      </circle>
    </g>

    <!-- floating particles -->
    <g fill="#c4b5fd">
      <circle cx="560" cy="270" r="3" opacity="0.7"><animate attributeName="cy" values="290;40" dur="9s" repeatCount="indefinite"/></circle>
      <circle cx="700" cy="300" r="2.5" opacity="0.6"><animate attributeName="cy" values="310;30" dur="12s" repeatCount="indefinite"/></circle>
      <circle cx="810" cy="280" r="3" fill="#2dd4bf" opacity="0.7"><animate attributeName="cy" values="300;50" dur="10s" repeatCount="indefinite"/></circle>
      <circle cx="420" cy="300" r="2" opacity="0.5"><animate attributeName="cy" values="320;20" dur="14s" repeatCount="indefinite"/></circle>
    </g>

    <!-- 3D extruded title: stacked dark layers, then the lit face -->
    <g>
      <use href="#title" x="9" y="9" fill="#0b1b2b" opacity="0.9"/>
      <use href="#title" x="8" y="8" fill="#1a1450"/>
      <use href="#title" x="7" y="7" fill="#231a6b"/>
      <use href="#title" x="6" y="6" fill="#2b2084"/>
      <use href="#title" x="5" y="5" fill="#33269c"/>
      <use href="#title" x="4" y="4" fill="#3b2db3"/>
      <use href="#title" x="3" y="3" fill="#4a3ac9"/>
      <use href="#title" x="2" y="2" fill="#5f4de0"/>
      <use href="#title" x="1" y="1" fill="#7c6af2"/>
      <use href="#title" fill="url(#face)"/>
    </g>

    <text x="62" y="205" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="26" font-weight="600" fill="#e0e7ff">Quantum-directed enzyme active-site optimization</text>
    <text x="62" y="240" font-family="'Courier New', monospace" font-size="19" fill="#5eead4">QUBO  ·  PETase 6ILW  ·  D-Wave Ocean  ·  FastAPI  ·  Next.js</text>

    <!-- event pill -->
    <g transform="translate(62,262)">
      <rect width="392" height="36" rx="18" fill="#8b5cf6" fill-opacity="0.22" stroke="#a78bfa" stroke-opacity="0.8"/>
      <circle cx="20" cy="18" r="5" fill="#2dd4bf"><animate attributeName="opacity" values="1;0.2;1" dur="1.6s" repeatCount="indefinite"/></circle>
      <text x="36" y="24" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#ede9fe">Q-Hack India 2026 by Infinitude  |  Team Monday</text>
    </g>
  </g>
  <rect x="1" y="1" width="1198" height="318" rx="22" fill="none" stroke="#8b5cf6" stroke-opacity="0.5" stroke-width="2"/>
</svg>
