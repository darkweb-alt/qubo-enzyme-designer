<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1010 230" width="1010" height="230" role="img" aria-label="Pipeline: PDB 6ILW to Biopython to QUBO to dimod annealer to Next.js dashboard" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#080c1a"/><stop offset="1" stop-color="#14103a"/></linearGradient>
    <linearGradient id="box" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4c3bd1"/><stop offset="1" stop-color="#1e1568"/></linearGradient>
    <linearGradient id="boxT" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#14b8a6"/><stop offset="1" stop-color="#0b4f55"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="9" stdDeviation="7" flood-color="#000" flood-opacity="0.6"/></filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#a5b4fc"/></marker>
  </defs>
  <rect width="1010" height="230" rx="20" fill="url(#bg)"/>
  <rect x="1" y="1" width="1008" height="228" rx="20" fill="none" stroke="#8b5cf6" stroke-opacity="0.45" stroke-width="2"/>

  <g font-family="'Segoe UI', Arial, sans-serif" text-anchor="middle">
    <!-- boxes -->
    <g filter="url(#shadow)">
      <rect x="30" y="60" width="150" height="100" rx="14" fill="url(#box)" stroke="#a78bfa" stroke-opacity="0.7"/>
      <rect x="230" y="60" width="150" height="100" rx="14" fill="url(#box)" stroke="#a78bfa" stroke-opacity="0.7"/>
      <rect x="430" y="60" width="150" height="100" rx="14" fill="url(#boxT)" stroke="#5eead4" stroke-opacity="0.8"/>
      <rect x="630" y="60" width="150" height="100" rx="14" fill="url(#boxT)" stroke="#5eead4" stroke-opacity="0.8"/>
      <rect x="830" y="60" width="150" height="100" rx="14" fill="url(#box)" stroke="#a78bfa" stroke-opacity="0.7"/>
    </g>
    <!-- top highlights for the 3D look -->
    <g fill="#ffffff" fill-opacity="0.12">
      <rect x="34" y="63" width="142" height="14" rx="7"/><rect x="234" y="63" width="142" height="14" rx="7"/>
      <rect x="434" y="63" width="142" height="14" rx="7"/><rect x="634" y="63" width="142" height="14" rx="7"/><rect x="834" y="63" width="142" height="14" rx="7"/>
    </g>
    <g fill="#f5f3ff" font-size="19" font-weight="700">
      <text x="105" y="106">RCSB PDB</text><text x="305" y="106">Biopython</text><text x="505" y="106">QUBO Model</text><text x="705" y="106">dimod Annealer</text><text x="905" y="106">Next.js UI</text>
    </g>
    <g fill="#c7d2fe" font-size="14">
      <text x="105" y="132">6ILW structure</text><text x="305" y="132">Euclidean clash matrix</text><text x="505" y="132">12 binary variables</text><text x="705" y="132">ground-state search</text><text x="905" y="132">live scrubber + curves</text>
    </g>
    <g fill="#a5b4fc" font-size="13">
      <text x="105" y="40">Input</text><text x="305" y="40">Parse</text><text x="505" y="40">Formulate</text><text x="705" y="40">Solve</text><text x="905" y="40">Visualize</text>
    </g>
    <text x="505" y="205" fill="#99f6e4" font-size="14">FastAPI backend orchestrates parse, formulate and solve</text>
  </g>

  <!-- arrows -->
  <g stroke="#a5b4fc" stroke-width="3" stroke-linecap="round" fill="none" marker-end="url(#arr)">
    <path d="M184,110 L226,110"/><path d="M384,110 L426,110"/><path d="M584,110 L626,110"/><path d="M784,110 L826,110"/>
  </g>

  <!-- moving data packets -->
  <g fill="#fff" filter="url(#glow)">
    <circle r="5"><animateMotion dur="2s" repeatCount="indefinite" path="M184,110 L226,110"/></circle>
    <circle r="5"><animateMotion dur="2s" begin="0.5s" repeatCount="indefinite" path="M384,110 L426,110"/></circle>
    <circle r="5"><animateMotion dur="2s" begin="1s" repeatCount="indefinite" path="M584,110 L626,110"/></circle>
    <circle r="5"><animateMotion dur="2s" begin="1.5s" repeatCount="indefinite" path="M784,110 L826,110"/></circle>
  </g>
</svg>
