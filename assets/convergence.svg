<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="900" height="480" role="img" aria-label="Energy versus annealing step: greedy search stalls at +42 kcal/mol while annealing reaches -142.5 kcal/mol" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080c1a"/><stop offset="1" stop-color="#14103a"/>
    </linearGradient>
    <linearGradient id="q" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8b5cf6"/><stop offset="1" stop-color="#2dd4bf"/>
    </linearGradient>
    <linearGradient id="qfill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0.28"/><stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="7" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="900" height="480" rx="20" fill="url(#bg)"/>
  <rect x="1" y="1" width="898" height="478" rx="20" fill="none" stroke="#8b5cf6" stroke-opacity="0.45" stroke-width="2"/>

  <text x="450" y="38" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="22" font-weight="700" fill="#e0e7ff">Energy Landscape Descent: Greedy vs Quantum Annealing</text>
  <text x="450" y="60" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#a5b4fc">Lower energy is better (kcal/mol, prototype scoring model)</text>

  <!-- gridlines + y labels: y(e)=100+(60-e)*1.4545 -->
  <g stroke="#6366f1" stroke-opacity="0.18">
    <line x1="90" y1="100" x2="840" y2="100"/>
    <line x1="90" y1="187" x2="840" y2="187"/>
    <line x1="90" y1="275" x2="840" y2="275"/>
    <line x1="90" y1="362" x2="840" y2="362"/>
    <line x1="90" y1="420" x2="840" y2="420"/>
  </g>
  <line x1="90" y1="187" x2="840" y2="187" stroke="#e0e7ff" stroke-opacity="0.35" stroke-dasharray="6 6"/>
  <g font-family="'Courier New', monospace" font-size="13" fill="#a5b4fc" text-anchor="end">
    <text x="80" y="104">+60</text>
    <text x="80" y="191">0</text>
    <text x="80" y="279">-60</text>
    <text x="80" y="366">-120</text>
    <text x="80" y="424">-160</text>
  </g>
  <text x="465" y="458" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#a5b4fc">Annealing step (sweeps)</text>
  <text transform="translate(28,260) rotate(-90)" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#a5b4fc">Energy (kcal/mol)</text>
  <line x1="90" y1="100" x2="90" y2="420" stroke="#a5b4fc" stroke-opacity="0.6"/>
  <line x1="90" y1="420" x2="840" y2="420" stroke="#a5b4fc" stroke-opacity="0.6"/>

  <!-- trap zone -->
  <rect x="250" y="118" width="590" height="40" rx="8" fill="#f59e0b" fill-opacity="0.08" stroke="#f59e0b" stroke-opacity="0.35" stroke-dasharray="5 5"/>

  <!-- quantum area fill -->
  <polygon points="90,103 130,131 160,166 185,146 220,215 260,248 290,214 340,304 390,343 430,324 480,379 550,396 650,399 840,399 840,420 90,420" fill="url(#qfill)">
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.35;0.7;1" dur="7s" repeatCount="indefinite"/>
  </polygon>

  <!-- classical greedy path -->
  <polyline pathLength="1000" fill="none" stroke="#f59e0b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="1000" stroke-dashoffset="1000"
    points="90,103 125,114 160,126 200,134 245,138 300,139 350,137 410,139 470,138 540,139 620,138 700,139 780,138 840,139" filter="url(#glow)">
    <animate attributeName="stroke-dashoffset" values="1000;0;0" keyTimes="0;0.5;1" dur="7s" repeatCount="indefinite"/>
  </polyline>

  <!-- quantum annealing path (uphill moves = barrier crossing) -->
  <polyline pathLength="1000" fill="none" stroke="url(#q)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="1000" stroke-dashoffset="1000"
    points="90,103 130,131 160,166 185,146 220,215 260,248 290,214 340,304 390,343 430,324 480,379 550,396 650,399 840,399" filter="url(#glow)">
    <animate attributeName="stroke-dashoffset" values="1000;0;0" keyTimes="0;0.6;1" dur="7s" repeatCount="indefinite"/>
  </polyline>

  <!-- end markers -->
  <g>
    <circle cx="840" cy="139" r="7" fill="#f59e0b">
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.5;0.55;1" dur="7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="840" cy="399" r="8" fill="#2dd4bf" filter="url(#glow)">
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.6;0.65;1" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="r" values="8;12;8" dur="1.8s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- labels -->
  <g filter="url(#shadow)">
    <rect x="560" y="76" width="240" height="30" rx="15" fill="#f59e0b" fill-opacity="0.18" stroke="#f59e0b"/>
    <text x="680" y="96" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="700" fill="#fde68a">Greedy: stuck at +42.0</text>
    <rect x="540" y="352" width="290" height="30" rx="15" fill="#2dd4bf" fill-opacity="0.18" stroke="#2dd4bf"/>
    <text x="685" y="372" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="700" fill="#99f6e4">Annealing: global min -142.5</text>
  </g>
  <text x="545" y="143" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#fcd34d" opacity="0.9">local-minimum trap</text>
  <text x="205" y="140" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#c4b5fd">uphill moves cross barriers</text>
  <path d="M185,146 L190,160" stroke="#c4b5fd" stroke-opacity="0.0"/>

  <!-- legend -->
  <g font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#e0e7ff">
    <line x1="110" y1="80" x2="140" y2="80" stroke="#f59e0b" stroke-width="4" stroke-linecap="round"/>
    <text x="148" y="85">Classical greedy</text>
    <line x1="270" y1="80" x2="300" y2="80" stroke="url(#q)" stroke-width="5" stroke-linecap="round"/>
    <text x="308" y="85">Annealing (QUBO)</text>
  </g>
</svg>
